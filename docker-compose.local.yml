# For running Postroom on your own Mac, nothing else — no domain, no HTTPS,
# no Nginx, no interaction with any other server. Just the app, reachable at
# http://localhost:3000.
#
#   docker compose -f docker-compose.local.yml up --build
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postroom
      POSTGRES_USER: postroom
      POSTGRES_PASSWORD: postroom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.local
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn postroom.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  celery_worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.local
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: celery -A postroom worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  media_data:
