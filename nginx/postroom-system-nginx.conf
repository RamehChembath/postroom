# For a server that ALREADY runs other sites behind its own Nginx (outside
# Docker) — e.g. alongside brandbuddiez/commerzio/hrezzy. Install this file at
# /etc/nginx/sites-available/postroom, matching how those other sites are set
# up, then:
#
#   ln -s /etc/nginx/sites-available/postroom /etc/nginx/sites-enabled/postroom
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d postroom.in -d www.postroom.in -d api.postroom.in
#
# certbot will rewrite this file to add the "listen 443 ssl" blocks and the
# certificate paths automatically — the same way it already did for your
# other sites. Don't hand-write the SSL block yourself; let certbot do it, so
# the paths it fills in are guaranteed correct.

server {
    server_name postroom.in www.postroom.in;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    listen 80;
}

server {
    server_name api.postroom.in;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    listen 80;
}
