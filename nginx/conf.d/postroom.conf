# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    server_name postroom.in www.postroom.in api.postroom.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Frontend: postroom.in ----
server {
    listen 443 ssl;
    server_name postroom.in www.postroom.in;

    ssl_certificate     /etc/letsencrypt/live/postroom.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postroom.in/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Backend API: api.postroom.in ----
server {
    listen 443 ssl;
    server_name api.postroom.in;

    ssl_certificate     /etc/letsencrypt/live/postroom.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postroom.in/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /static/;
    }
    location /media/ {
        alias /media/;
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
